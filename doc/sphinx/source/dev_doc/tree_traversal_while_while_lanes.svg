<svg xmlns="http://www.w3.org/2000/svg" class="tt-diagram" width="720" height="270" viewBox="0 0 720 270" role="img" aria-label="Lane by iteration grid: in the single loop, leaf scans happen at different iterations for each lane; with the while-while loop, every lane reaches its leaf before the warp scans leaves together.">
  <title>Leaf processing per lane: single loop against while-while loop</title>
  <style>
    /* Colours follow the pydata-sphinx-theme variables (and so the light/dark switch) when the
       SVG is inlined in the doc; the fallbacks are used when the file is viewed on its own. */
    .tt-diagram {
      --tt-ink: var(--pst-color-text-base, #19211e);
      --tt-mut: var(--pst-color-text-muted, #5b6763);
      --tt-line: var(--pst-color-border, #c6cec9);
      --tt-surface: var(--pst-color-background, #fcfcfb);
      --tt-faint: var(--pst-color-surface, #e7ece8);
      --tt-hot: var(--pst-color-warning, #b8641b);
      --tt-hot-soft: var(--pst-color-warning-bg, #f3e4d6);
      --tt-display: var(--pst-font-family-base, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif);
      --tt-mono: var(--pst-font-family-monospace, ui-monospace, Menlo, monospace);
      color: var(--tt-ink);
      max-width: 100%;
      height: auto;
    }
    .tt-diagram .tt-lbl { font: 500 12.5px var(--tt-display); fill: currentColor; }
    .tt-diagram .tt-small { font: 400 11.5px var(--tt-display); fill: currentColor; }
    .tt-diagram .tt-b { font-weight: 700; }
    .tt-diagram .tt-tick { font: 400 10.5px var(--tt-mono); fill: var(--tt-mut); }
    .tt-diagram .tt-val { font: 500 11.5px var(--tt-mono); fill: currentColor; }
    .tt-diagram .tt-mono { font: 12px var(--tt-mono); fill: currentColor; }
    .tt-diagram .tt-mut { fill: var(--tt-mut); }
    .tt-diagram .tt-ln { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .tt-diagram .tt-dash { stroke-dasharray: 4 3; }
    .tt-diagram .tt-grid { stroke: var(--tt-line); stroke-width: 1; }
    .tt-diagram .tt-box { fill: var(--tt-surface); stroke: currentColor; stroke-width: 1.2; }
    .tt-diagram .tt-box.tt-hotB { fill: var(--tt-hot-soft); stroke: var(--tt-hot); }
    .tt-diagram .tt-cell { fill: var(--tt-faint); stroke: var(--tt-line); stroke-width: 1; }
    .tt-diagram .tt-hotF, .tt-diagram .tt-cell.tt-hotF { fill: var(--tt-hot); stroke: none; }
    .tt-diagram .tt-cell.tt-idle { fill: none; stroke: var(--tt-line); stroke-dasharray: 2 2; }
    .tt-diagram .tt-track { fill: var(--tt-faint); stroke: none; }
    .tt-diagram .tt-nodeC { fill: var(--tt-surface); stroke: currentColor; stroke-width: 1.2; }
  </style>
