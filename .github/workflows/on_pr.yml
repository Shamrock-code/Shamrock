name: on PR

# Controls when the workflow will run
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

jobs:

  detect_ci_flags:
    name: Detect CI flags
    runs-on: ubuntu-latest
    outputs:
      check_cpp: ${{ steps.flags.outputs.check_cpp }}
      run_sph_tests: ${{ steps.flags.outputs.run_sph_tests }}
      run_ramses_tests: ${{ steps.flags.outputs.run_ramses_tests }}
      run_zeus_tests: ${{ steps.flags.outputs.run_zeus_tests }}
      run_gsph_tests: ${{ steps.flags.outputs.run_gsph_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff against PR base
        run: git diff ${{ github.event.pull_request.base.sha }} HEAD > pr.diff
      - name: Detect flags
        id: flags
        run: python3 tools/detect_ci_flags.py --diff pr.diff --github-output "$GITHUB_OUTPUT"

  main_workflow:
    name: CI
    needs: [detect_ci_flags]
    uses: ./.github/workflows/main_workflow.yml
    with:
      run_build_push_docker: true
      light_ci: ${{ contains(github.event.pull_request.labels.*.name, 'light-ci') }}
      # check_cpp: ${{ needs.detect_ci_flags.outputs.check_cpp == 'true' }}
      # run_sph_tests: ${{ needs.detect_ci_flags.outputs.run_sph_tests == 'true' }}
      # run_ramses_tests: ${{ needs.detect_ci_flags.outputs.run_ramses_tests == 'true' }}
      # run_zeus_tests: ${{ needs.detect_ci_flags.outputs.run_zeus_tests == 'true' }}
      # run_gsph_tests: ${{ needs.detect_ci_flags.outputs.run_gsph_tests == 'true' }}

  light_ci:
    name: Notify Light CI
    if: ${{ contains(github.event.pull_request.labels.*.name, 'light-ci') }}
    runs-on: ubuntu-latest
    steps:
      - name: Echo message
        run: |
          cat >> report_______light_ci.md <<'EOF'


          Light CI is enabled. This will only run the basic tests and not the full tests.
          Merging a PR require the job "on PR / all" to pass which is disabled in this case.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: report_light_ci
          path: ./report_______light_ci.md

  all:
    needs: [ main_workflow ]
    # run always except for cancel
    if: ${{ always() && !cancelled() && !contains(github.event.pull_request.labels.*.name, 'light-ci') }}
    runs-on: ubuntu-latest
    steps:
    - name: Status summary
      run: |
        if [ "${{ needs.main_workflow.result }}" == "failure" ] || [ "${{ needs.main_workflow.result }}" == "canceled" ]; then
          echo "Tests failed."
          exit 1
        else
          exit 0
        fi

  # this job notify the end of the build regardless of light-ci value
  all_light:
    needs: [ main_workflow ]
    # run always except for cancel
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - name: Status summary
      run: |
        if [ "${{ needs.main_workflow.result }}" == "failure" ] || [ "${{ needs.main_workflow.result }}" == "canceled" ]; then
          echo "Tests failed."
          exit 1
        else
          exit 0
        fi
