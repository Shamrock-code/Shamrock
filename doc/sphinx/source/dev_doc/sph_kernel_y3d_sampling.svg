<svg xmlns="http://www.w3.org/2000/svg" class="y3d-diagram" width="1060" height="450" viewBox="0 0 1060 450" role="img" aria-labelledby="y3d-title">
  <title id="y3d-title">Y_3d z samples before and after the symmetric sum</title>
  <style>
    /* Colours follow the pydata-sphinx-theme variables (and so the light/dark switch) when the
       SVG is inlined in the doc; the fallbacks are used when the file is viewed on its own. */
    .y3d-diagram {
      --y3d-fg: var(--pst-color-text-base, #374151);
      --y3d-muted: var(--pst-color-text-muted, #6b7280);
      --y3d-accent: var(--pst-color-primary, #2563eb);
      --y3d-bg: var(--pst-color-background, #ffffff);
      --y3d-surface: var(--pst-color-surface, #f1f3f6);
      --y3d-rule: var(--pst-color-border, #e5e7eb);
      font-family: var(--pst-font-family-base, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif);
      max-width: 100%;
      height: auto;
    }
    .y3d-diagram text { fill: var(--y3d-fg); }
    .y3d-diagram .strong { font-weight: 600; }
    .y3d-diagram .muted { fill: var(--y3d-muted); }
    .y3d-diagram .mono { font-family: var(--pst-font-family-monospace, ui-monospace, Menlo, monospace); }
    .y3d-diagram .rule { stroke: var(--y3d-rule); }
    .y3d-diagram .axis { stroke: var(--y3d-muted); stroke-width: 1.2; }
    .y3d-diagram .arc { fill: none; stroke: var(--y3d-muted); stroke-width: 1.4; }
    .y3d-diagram .arrowhead { fill: var(--y3d-muted); }
    .y3d-diagram .eval { fill: var(--y3d-accent); }
    .y3d-diagram .reuse { fill: var(--y3d-bg); stroke: var(--y3d-accent); stroke-width: 2; stroke-dasharray: 3 2.5; }
    .y3d-diagram .skip { fill: var(--y3d-surface); stroke: var(--y3d-muted); stroke-width: 1.5; }
    .y3d-diagram .skip-x { stroke: var(--y3d-muted); stroke-width: 1.8; }
    .y3d-diagram .never { fill: none; stroke: var(--y3d-muted); stroke-width: 1.5; opacity: 0.6; }
  </style>
  <defs>
    <marker id="y3d-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <g id="y3d-eval"><circle class="eval" r="9"/></g>
    <g id="y3d-reuse"><circle class="reuse" r="9"/></g>
    <g id="y3d-skip"><circle class="skip" r="9"/><path class="skip-x" d="M-5,-5 L5,5 M5,-5 L-5,5"/></g>
    <g id="y3d-never"><circle class="never" r="5"/></g>
  </defs>

  <!-- Title -->
  <text class="strong" x="20" y="34" font-size="19">Column kernel integral Y_3d: z samples per version (np = 4, Δz = R/4)</text>
  <text class="muted" x="20" y="56" font-size="13">Y_3d(r, h) ∝ Σ f(√(x² + z²)) · Δz over z ∈ [−R, R), x = r/h. Both versions use the same 8-point grid; only the number of kernel evaluations changes.</text>

  <!-- Legend -->
  <g transform="translate(20,88)" font-size="12.5">
    <use href="#y3d-eval" x="9" y="0"/><text x="26" y="4">f evaluated</text>
    <use href="#y3d-reuse" x="129" y="0"/><text x="146" y="4">reused from mirror point (f even in z)</text>
    <use href="#y3d-skip" x="409" y="0"/><text x="426" y="4">not computed (f = 0 at z = −R)</text>
    <use href="#y3d-never" x="649" y="0"/><text x="662" y="4">z = R (not part of the sum)</text>
  </g>

  <!-- Column headers -->
  <g class="muted" font-size="11.5" letter-spacing="0.5">
    <text class="muted" x="20" y="128">VERSION</text>
    <text class="muted" x="240" y="128">SAMPLE POINTS ALONG z</text>
    <text class="muted" x="760" y="128">COST, RESULT, RTX 3070 MEDIAN TIME</text>
  </g>
  <line class="rule" x1="20" y1="136" x2="1040" y2="136"/>

  <!-- ================= Row 1: main ================= -->
  <g>
    <text class="strong" x="20" y="196" font-size="15">main (before)</text>
    <text class="muted mono" x="20" y="216" font-size="12.5">048835278</text>

    <line class="axis" x1="225" y1="225" x2="695" y2="225"/>
    <use href="#y3d-eval" x="240" y="225"/>
    <use href="#y3d-eval" x="295" y="225"/>
    <use href="#y3d-eval" x="350" y="225"/>
    <use href="#y3d-eval" x="405" y="225"/>
    <use href="#y3d-eval" x="460" y="225"/>
    <use href="#y3d-eval" x="515" y="225"/>
    <use href="#y3d-eval" x="570" y="225"/>
    <use href="#y3d-eval" x="625" y="225"/>
    <use href="#y3d-never" x="680" y="225"/>
    <text class="muted" x="240" y="205" font-size="11" text-anchor="middle">= 0</text>

    <g class="muted" font-size="11.5" text-anchor="middle">
      <text class="muted" x="240" y="250">−R</text><text class="muted" x="295" y="250">−¾R</text><text class="muted" x="350" y="250">−½R</text><text class="muted" x="405" y="250">−¼R</text><text class="muted" x="460" y="250">0</text><text class="muted" x="515" y="250">¼R</text><text class="muted" x="570" y="250">½R</text><text class="muted" x="625" y="250">¾R</text><text class="muted" x="680" y="250">R</text>
    </g>
    <text x="240" y="272" font-size="12">Σ<tspan font-size="9" dy="3">k=−4..3</tspan><tspan dy="-3"> f(√(x²+z</tspan><tspan font-size="9" dy="3">k</tspan><tspan dy="-3">²)) · Δz  — plain Riemann loop, z += Δz</tspan></text>

    <g font-size="12.5">
      <text x="760" y="196"><tspan class="strong">8</tspan> kernel evaluations per call</text>
      <text x="760" y="216">result: reference</text>
      <text x="760" y="236">cartesian column ρ: <tspan class="strong">0.589 s</tspan></text>
      <text x="760" y="256">azimuthal ρ: <tspan class="strong">10.08 s</tspan></text>
    </g>
  </g>

  <line class="rule" x1="20" y1="290" x2="1040" y2="290"/>

  <!-- ================= Row 2: after ================= -->
  <g>
    <text class="strong" x="20" y="366" font-size="15">after (symmetric sum)</text>

    <line class="axis" x1="225" y1="395" x2="695" y2="395"/>
    <!-- mirror arcs: positive side -> negative side -->
    <g marker-end="url(#y3d-arr)">
      <path class="arc" d="M515,384 Q460,334 405,384"/>
      <path class="arc" d="M570,384 Q460,309 350,384"/>
      <path class="arc" d="M625,384 Q460,284 295,384"/>
    </g>
    <use href="#y3d-skip" x="240" y="395"/>
    <use href="#y3d-reuse" x="295" y="395"/>
    <use href="#y3d-reuse" x="350" y="395"/>
    <use href="#y3d-reuse" x="405" y="395"/>
    <use href="#y3d-eval" x="460" y="395"/>
    <use href="#y3d-eval" x="515" y="395"/>
    <use href="#y3d-eval" x="570" y="395"/>
    <use href="#y3d-eval" x="625" y="395"/>
    <use href="#y3d-never" x="680" y="395"/>
    <text class="muted" x="240" y="375" font-size="11" text-anchor="middle">= 0</text>

    <g class="muted" font-size="11.5" text-anchor="middle">
      <text class="muted" x="240" y="420">−R</text><text class="muted" x="295" y="420">−¾R</text><text class="muted" x="350" y="420">−½R</text><text class="muted" x="405" y="420">−¼R</text><text class="muted" x="460" y="420">0</text><text class="muted" x="515" y="420">¼R</text><text class="muted" x="570" y="420">½R</text><text class="muted" x="625" y="420">¾R</text><text class="muted" x="680" y="420">R</text>
    </g>
    <text x="240" y="442" font-size="12">Δz · [ f(|x|) + 2 · Σ<tspan font-size="9" dy="3">k=1..3</tspan><tspan dy="-3"> f(√(x² + z</tspan><tspan font-size="9" dy="3">k</tspan><tspan dy="-3">²)) ]  — sum reordered, Δz factored out</tspan></text>

    <g font-size="12.5">
      <text x="760" y="366"><tspan class="strong">4</tspan> kernel evaluations per call</text>
      <text x="760" y="386">result: matches main to a few ulp (≤ 7e-15)</text>
      <text x="760" y="406">cartesian column ρ: <tspan class="strong">0.375 s</tspan> <tspan class="muted">(1.57× vs main)</tspan></text>
      <text x="760" y="426">azimuthal ρ: <tspan class="strong">7.25 s</tspan> <tspan class="muted">(1.39× vs main)</tspan></text>
    </g>
  </g>
</svg>
