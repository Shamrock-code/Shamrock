name: Archive workflow

on:
  workflow_call:

jobs:
  extract_version:
    name: Extract Version
    uses: ./.github/workflows/extract_version.yml

  make_code_archive:
    name: Make code archive
    runs-on: ubuntu-latest
    needs: extract_version
    steps:
      - uses: Shamrock-code/action-make-code-archive@v1.1
        with:
          output_name: shamrock-${{ needs.extract_version.outputs.version }}.tar.gz
